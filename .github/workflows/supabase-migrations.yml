name: Supabase migrations

on:
  push:
    branches:
      - main
    # Only a merged migration has anything to apply; every other push to main
    # would just spend a run proving the database is already up to date.
    paths:
      - supabase/migrations/**
  workflow_dispatch:

# Two merges in quick succession must not push the same migration twice at
# once; the second run waits and then finds nothing left to apply.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    # The production environment scopes the database credentials to this job,
    # so no other workflow can read them.
    environment: production

    env:
      # Session-pooler connection string (port 5432), password included. The
      # direct host is IPv6-only on the free plan and GitHub runners have no
      # IPv6, so `--remote=<ref>` cannot reach it; the shared pooler is IPv4.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Not used by the push itself. Referencing them is what makes the runner
      # mask them, so the ref (it is the pooler username, `postgres.<ref>`) and
      # the password stay hidden if the CLI prints parts of the URL.
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v3
        with:
          # Pinned to the CLI the migrations were written and dry-run with, so
          # a CLI release cannot change what a push does between two merges.
          version: 3.0.0

      # Read from the environment rather than interpolated into the script, so
      # the URL never becomes part of the generated shell command.
      - run: supabase db push --remote="$SUPABASE_DB_URL" --yes
